name: build
on: pull_request
jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: /
          key: root
      - name: Install curl
        run: sudo apt-get install libcurl4-openssl-dev
  configure-linux-x86_64-gcc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v5
      - name: Load cached data
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/build-linux-x86_64-gcc
          key: linux-x86_64-gcc-${{ hashFiles('**/CMakeLists.txt') }}
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: /
          key: root
      - name: Configure Linux x86_64 gcc and Ninja
        run: cmake -B ${{github.workspace}}/build-linux-x86_64-gcc -G Ninja -D CMAKE_C_COMPILER=gcc
  configure-linux-x86_64-clang:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v5
      - name: Load cached data
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/build-linux-x86_64-clang
          key: linux-x86_64-clang-${{ hashFiles('**/CMakeLists.txt') }}
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: /
          key: root
      - name: Configure Linux x86_64 clang and Ninja
        run: cmake -B ${{github.workspace}}/build-linux-x86_64-clang -G Ninja -D CMAKE_C_COMPILER=clang
  build-linux-x86_64-gcc:
    runs-on: ubuntu-latest
    needs: configure-linux-x86_64-gcc
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v5
      - name: Load cached data
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/build-linux-x86_64-gcc
          key: linux-x86_64-gcc-${{ hashFiles('**/CMakeLists.txt') }}
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: /
          key: root
      - name: Build Linux x86_64 gcc and Ninja
        run: cmake --build ${{github.workspace}}/build-linux-x86_64-gcc
  build-linux-x86_64-clang:
    runs-on: ubuntu-latest
    needs: configure-linux-x86_64-clang
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v5
      - name: Load cached data
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/build-linux-x86_64-clang
          key: linux-x86_64-clang-${{ hashFiles('**/CMakeLists.txt') }}
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: /
          key: root
      - name: Build Linux x86_64 clang and Ninja
        run: cmake --build ${{github.workspace}}/build-linux-x86_64-clang
  test-linux-x86_64-gcc:
    runs-on: ubuntu-latest
    needs: build-linux-x86_64-gcc
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v5
      - name: Load cached data
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/build-linux-x86_64-gcc
          key: linux-x86_64-gcc-${{ hashFiles('**/CMakeLists.txt') }}
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: /
          key: root
      - name: Test Linux x86_64 gcc and Ninja
        run: ctest --test-dir ${{github.workspace}}/build-linux-x86_64-gcc --output-on-failure
  test-linux-x86_64-clang:
    runs-on: ubuntu-latest
    needs: build-linux-x86_64-clang
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v5
      - name: Load cached data
        uses: actions/cache@v4
        with:
          path: ${{github.workspace}}/build-linux-x86_64-clang
          key: linux-x86_64-clang-${{ hashFiles('**/CMakeLists.txt') }}
      - name: Load dependency cache
        uses: actions/cache@v4
        with:
          path: /
          key: root
      - name: Test Linux x86_64 clang and Ninja
        run: ctest --test-dir ${{github.workspace}}/build-linux-x86_64-clang --output-on-failure
