name: main
on: pull_request
jobs:
  get-gcc-15:
    runs-on: ubuntu-latest
    steps:
      - name: Load gcc 15 Cache
        uses: actions/cache@v5
        with:
          path: /home/runner/gcc-15.2.0-x86_64-pc-linux-gnu-c
          key: gcc-15.2.0-x86_64-pc-linux-gnu-c
      - name: Check if GCC 15 is present
        id: check
        run: |
          if [[ ! -f $HOME/gcc-15.2.0-x86_64-pc-linux-gnu-c/bin/gcc ]]
          then
            echo requires_download=true >> $GITHUB_OUTPUT
          fi
        shell: bash
      - name: Download GCC 15
        if: ${{ steps.check.outputs.requires_download }}
        run:
          curl https://files.octoalex.me/gcc/15.2.0/gcc-15.2.0-x86_64-pc-linux-gnu-c.tar.xz
          --output $HOME/gcc-15.2.0-x86_64-pc-linux-gnu-c.tar.xz
      - name: Install GCC 15
        if: ${{ steps.check.outputs.requires_download }}
        run: tar -xJf $HOME/gcc-15.2.0-x86_64-pc-linux-gnu-c.tar.xz -C $HOME
      - name: Cleanup
        if: ${{ steps.check.outputs.requires_download }}
        run: rm $HOME/gcc-15.2.0-x86_64-pc-linux-gnu-c.tar.xz
        shell: bash
  build-linux-x86_64-gcc:
    runs-on: ubuntu-latest
    needs: get-gcc-15
    steps:
      - name: Checkout changes
        uses: actions/checkout@v5
      - name: Load Build Caches
        uses: actions/cache@v5
        with:
          path: /home/runner/linux-x86_64-gcc
          key: linux-x86_64-gcc-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Get APT Packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libcurl4-openssl-dev clang-19
          version: 0.0.0
      - name: Load gcc 15 Cache
        uses: actions/cache@v5
        with:
          path: /home/runner/gcc-15.2.0-x86_64-pc-linux-gnu-c
          key: gcc-15.2.0-x86_64-pc-linux-gnu-c
      - name: Configure CMake
        run: cmake -B $HOME/linux-x86_64-gcc -G Ninja -D CMAKE_C_COMPILER=$HOME/gcc-15.2.0-x86_64-pc-linux-gnu-c/bin/gcc
      - name: Build
        run: cmake --build $HOME/linux-x86_64-gcc -j 8
  build-linux-x86_64-clang:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout changes
        uses: actions/checkout@v5
      - name: Load Build Caches
        uses: actions/cache@v5
        with:
          path: /home/runner/linux-x86_64-clang
          key: linux-x86_64-clang-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Get APT Packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libcurl4-openssl-dev clang-19
          version: 0.0.0
      - name: Configure CMake
        run: cmake -B $HOME/linux-x86_64-clang -G Ninja -D CMAKE_C_COMPILER=clang-19
      - name: Build
        run: cmake --build $HOME/linux-x86_64-clang -j 8
  test-linux-x86_64-gcc:
    runs-on: ubuntu-latest
    needs: build-linux-x86_64-gcc
    steps:
      - name: Checkout changes
        uses: actions/checkout@v5
      - name: Load Build Caches
        uses: actions/cache@v5
        with:
          path: /home/runner/linux-x86_64-gcc
          key: linux-x86_64-gcc-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Get APT Packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libcurl4-openssl-dev clang-19
          version: 0.0.0
      - name: Run Tests
        run: ctest --test-dir $HOME/linux-x86_64-gcc --output-on-failure
  test-linux-x86_64-clang:
    runs-on: ubuntu-latest
    needs: build-linux-x86_64-clang
    steps:
      - name: Checkout changes
        uses: actions/checkout@v5
      - name: Load Build Caches
        uses: actions/cache@v5
        with:
          path: /home/runner/linux-x86_64-clang
          key: linux-x86_64-clang-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
      - name: Get APT Packages
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libcurl4-openssl-dev clang-19
          version: 0.0.0
      - name: Run Tests
        run: ctest --test-dir $HOME/linux-x86_64-clang --output-on-failure
